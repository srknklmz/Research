<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinaps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&amp;family=Barlow:wght@400;500&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="gl"></div>
  <div id="labels"></div>
  <div class="vignette"></div>
  <div id="sleep">BEYİN UYUYOR<small>İlk veriyi bırak, uyansın</small></div>
</div>

<header class="top">
  <div class="mark">SINAPS</div>
  <div class="tag"><span id="sync">BAĞLANIYOR</span><small id="stats"></small></div>
</header>
<div id="banner" hidden></div>

<div id="work">
  <div id="caption"></div>
  <div id="progress"><i></i></div>
  <p id="stream"></p>
</div>

<section id="add">
  <form id="addForm" autocomplete="off">
    <div class="add-main">
      <textarea id="addIn" rows="1" placeholder="Beynine bir şey bırak: metin, link, PDF, görsel"></textarea>
      <div class="add-extra">
        <input id="addUrl" type="url" placeholder="Kaynak linki (isteğe bağlı)">
        <input id="addWhy" type="text" placeholder="Neden kaydediyorsun? (isteğe bağlı)">
        <div id="fileList"></div>
      </div>
    </div>
    <div class="add-side">
      <label class="ghost small file" title="Dosya ekle">DOSYA<input id="addFile" type="file" multiple accept=".pdf,.txt,.md,image/*" hidden></label>
      <button class="ghost solid" type="submit">GÖNDER</button>
    </div>
  </form>
</section>

<nav id="bar" aria-label="Menü">
  <button id="btnList" type="button" title="Notlar" aria-label="Notlar"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg></button>
  <button id="btnIdeas" type="button" title="Fikirler" aria-label="Fikirler"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="19" cy="19" r="2"/><path d="M7 12c6 0 4-7 10-7M7 12c6 0 4 7 10 7"/></svg></button>
  <button id="btnProfile" type="button" title="Profil" aria-label="Profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3.5-6 7-6s7 2 7 6"/></svg></button>
  <button id="btnAdd" class="main" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>EKLE</span></button>
  <button id="btnSearch" class="wide" type="button"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><span>ARA</span></button>
  <span class="sep"></span>
  <button id="btnSound" type="button" title="Ses" aria-label="Ses"><svg viewBox="0 0 24 24"><path d="M4 10v4h3l5 4V6L7 10H4zM16 9c1.5 1.5 1.5 4.5 0 6M18.5 6.5c3 3 3 8 0 11"/></svg></button>
  <button id="btnTheme" type="button" title="Tema" aria-label="Tema"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg></button>
  <button id="btnQuality" class="txt" type="button" title="Görsel kalite">YÜKSEK</button>
</nav>

<aside id="note" aria-label="Not"></aside>

<aside id="list" class="panel">
  <h2>NOTLAR</h2>
  <input id="listSearch" class="field" type="search" placeholder="Notlarda ara">
  <div id="listChips" class="chips"></div>
  <button id="newNote" class="ghost small wide" type="button">+ KENDİ NOTUNU YAZ</button>
  <div id="listBody"></div>
</aside>

<aside id="profile" class="panel">
  <h2>PROFİL</h2>
  <p class="hint">Sinaps fikirleri bunlara göre üretir ve yeni verinin hangi projene yaradığını söyler.</p>
  <form id="profileForm" autocomplete="off">
    <label>İLGİ ALANLARI<textarea id="pInterests" class="field" rows="3"></textarea></label>
    <label>HEDEFLER<textarea id="pGoals" class="field" rows="3"></textarea></label>
    <label>AKTİF PROJELER<small>Her satıra bir proje: ad — kısa açıklama</small><textarea id="pProjects" class="field" rows="4"></textarea></label>
    <label>KOLEKSİYONLAR<small>Virgülle ayır</small><input id="pCollections" class="field" type="text"></label>
    <div id="learned"></div>
    <div class="row"><button class="ghost solid" type="submit">KAYDET</button></div>
  </form>
</aside>

<section id="ideas">
  <div class="ideas-in">
    <div class="ideas-head"><h2>FİKİR AĞACI</h2><div id="ideaChips" class="chips"></div><span class="spacer"></span><button id="synthBtn" class="ghost small" type="button">ARŞİVDEN SENTEZ ÜRET</button><button class="ghost small" data-close type="button">KAPAT</button></div>
    <div class="ideas-grid">
      <div id="tree"></div>
      <div id="ideaDetail"></div>
    </div>
  </div>
</section>

<div id="palette">
  <div class="pal">
    <input id="palIn" type="text" placeholder="NOT, KAVRAM YA DA KİŞİ ARA" autocomplete="off">
    <div id="palList"></div>
  </div>
</div>

<div id="modal" hidden><div id="modalCard"></div></div>
<div id="toast" hidden></div>
<div class="dropveil"><div><b>BIRAK</b><span>Sinaps okuyup beynine bağlasın</span></div></div>

<script src="app.js"></script>
</body>
</html>
