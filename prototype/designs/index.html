<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="__FONTS__" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="gl"></div>
  <div id="labels"></div>
  <div class="vignette"></div>
</div>

<header class="top">
  <div class="mark">SINAPS</div>
  <div class="tag"><span id="designTag"></span><small id="designBlurb"></small></div>
</header>

<div id="work">
  <div id="caption"></div>
  <div id="progress"><i></i></div>
  <p id="stream"></p>
</div>

<section id="add">
  <form id="addForm" autocomplete="off">
    <textarea id="addIn" rows="1" placeholder="Beynine bir şey bırak: metin, link, PDF, görsel"></textarea>
    <button class="ghost solid" type="submit">GÖNDER</button>
  </form>
</section>

<nav id="bar" aria-label="Menü">
  <button id="btnList" type="button" title="Notlar" aria-label="Notlar"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg></button>
  <button id="btnIdeas" type="button" title="Fikirler" aria-label="Fikirler"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="19" cy="19" r="2"/><path d="M7 12c6 0 4-7 10-7M7 12c6 0 4 7 10 7"/></svg></button>
  <button id="btnAdd" class="main" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>EKLE</span></button>
  <button id="btnSearch" class="wide" type="button"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><span>ARA</span></button>
  <span class="sep"></span>
  <button id="btnSound" type="button" title="Ses" aria-label="Ses"><svg viewBox="0 0 24 24"><path d="M4 10v4h3l5 4V6L7 10H4zM16 9c1.5 1.5 1.5 4.5 0 6M18.5 6.5c3 3 3 8 0 11"/></svg></button>
  <button id="btnTheme" type="button" title="Tema" aria-label="Tema"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg></button>
  <button id="btnQuality" class="txt" type="button" title="Görsel kalite">YÜKSEK</button>
</nav>

<aside id="note" aria-label="Not"></aside>

<aside id="list" class="panel">
  <h2>NOTLAR</h2>
  <div id="listBody"></div>
</aside>

<section id="ideas">
  <div class="ideas-in">
    <div class="ideas-head"><h2>FİKİR AĞACI</h2><button class="ghost" data-close type="button">KAPAT</button></div>
    <div class="ideas-grid">
      <div id="tree"></div>
      <div id="ideaDetail"></div>
    </div>
  </div>
</section>

<div id="palette">
  <div class="pal">
    <input id="palIn" type="text" placeholder="NOT, KAVRAM YA DA KİŞİ ARA" autocomplete="off">
    <div id="palList"></div>
  </div>
</div>

<div class="dropveil"><div><b>BIRAK</b><span>Sinaps okuyup beynine bağlasın</span></div></div>
<div class="bars"></div>

<script>window.SINAPS_DESIGN=__ID__;</script>
<script src="app.js"></script>
</body>
</html>
