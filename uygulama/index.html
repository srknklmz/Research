<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beyin Sistemi</title>
<meta name="description" content="Hedefleri takip eden, gelen bilgiyi hedeflerle eşleştiren ikinci beyin.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EDEFF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1114" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Beyin">
<link rel="apple-touch-icon" href="ikon-192.png">
<link rel="icon" href="ikon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="stil.css">
</head>
<body>

<header class="hdr">
  <div class="hdr-top">
    <h1>Beyin Sistemi</h1>
    <span class="stamp mono" id="stamp">—</span>
  </div>
  <nav class="tabs" role="tablist" aria-label="Bölümler">
    <button class="tab" role="tab" aria-selected="true"  data-v="bugun">Bugün</button>
    <button class="tab" role="tab" aria-selected="false" data-v="hedefler">Hedefler</button>
    <button class="tab" role="tab" aria-selected="false" data-v="veriler">Veriler</button>
    <button class="tab" role="tab" aria-selected="false" data-v="arsiv">Arşiv</button>
    <button class="tab" role="tab" aria-selected="false" data-v="ayarlar">Ayarlar</button>
  </nav>
</header>

<main>
  <section class="view" id="v-bugun"    role="tabpanel"></section>
  <section class="view" id="v-hedefler" role="tabpanel" hidden></section>
  <section class="view" id="v-veriler"  role="tabpanel" hidden></section>
  <section class="view" id="v-arsiv"    role="tabpanel" hidden></section>
  <section class="view" id="v-ayarlar"  role="tabpanel" hidden></section>
</main>

<button class="fab" id="fab" aria-label="Yeni bilgi ekle">+</button>

<div id="katman"></div>

<script src="uygulama.js"></script>
</body>
</html>
